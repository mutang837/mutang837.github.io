# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 江枫线
subtitle: '我的博客'
description: '兴趣使然的blog，分享属于自己的感悟与生活'
keywords:
author: 江枫渔火
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://mutang837.github.io
root: /
permalink: posts/:abbrlink.html   # 你可以自己定格式，比如 archives/:abbrlink
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: true
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: false
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: fluid

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:mutang837/mutang837.github.io.git
  branch: main


neat_enable: true

neat_html:
  enable: true
  exclude:

neat_css:
  enable: true
  exclude:
    - '*.min.css'

neat_js:
  enable: true
  mangle: true
  output:
  compress:
  exclude:
    - '*.min.js'
    - '**/fluid*.js'


# 普通站点地图
sitemap:
  path: sitemap.xml
  tag: true
  category: true



nofollow:
  enable: true
  exclude:   # 排除你自己的域名，不要加 nofollow
    - mutang837.github.io


abbrlink:
  alg: crc32   # 算法：crc32 或 crc16
  rep: hex     # 输出进制：dec（十进制）或 hex（十六进制）

symbols_count_time:
  symbols: true
  time: true
  total_symbols: true
  total_time: true
  exclude_codeblock: false
  awl: 4
  wpm: 275
  suffix: "mins."

# RSS Feed Settings
feed:
  enable: true
  type: atom               # 订阅源类型：可以选择 atom 或 rss2
  path: atom.xml           # 生成的订阅文件路径和名称
  limit: 20                # 输出文章的最大篇数，false 或 0 表示不限制
  content: true            # 是否在 Feed 中包含文章全文
  content_limit: 140       # 若不包含全文，摘要内容的长度限制
  order_by: "-date"        # 文章排序，按发布日期倒序
  autodiscovery: true      # 是否让浏览器自动发现 Feed 链接
  # template: ./source/custom.xml # 可选，如果你有自定义模板，可以在这里指定